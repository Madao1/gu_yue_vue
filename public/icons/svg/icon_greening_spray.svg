<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 地插式喷淋杆 -->
    <line x1="128" y1="156" x2="128" y2="96" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 底部地插底座 -->
    <rect x="118" y="152" width="20" height="12" rx="3" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <ellipse cx="128" cy="166" rx="18" ry="5" fill="#FFFFFF" stroke="none" opacity="0.4"/>
    <!-- 旋转喷淋头 -->
    <circle cx="128" cy="90" r="10" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <circle cx="128" cy="90" r="5" fill="#1E40AF" stroke="none"/>
    <!-- 喷淋臂1（左上） -->
    <line x1="120" y1="84" x2="96" y2="68" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    <circle cx="94" cy="66" r="3.5" fill="#FFFFFF" stroke="none"/>
    <!-- 喷淋臂2（右上） -->
    <line x1="136" y1="84" x2="160" y2="68" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    <circle cx="162" cy="66" r="3.5" fill="#FFFFFF" stroke="none"/>
    <!-- 喷淋臂3（左中） -->
    <line x1="118" y1="90" x2="88" y2="82" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <circle cx="86" cy="81" r="3" fill="#FFFFFF" stroke="none"/>
    <!-- 喷淋臂4（右中） -->
    <line x1="138" y1="90" x2="168" y2="82" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <circle cx="170" cy="81" r="3" fill="#FFFFFF" stroke="none"/>
    <!-- 喷洒水雾弧线 -->
    <path d="M86 76 Q64 64, 52 76" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
    <path d="M170 76 Q192 64, 204 76" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
    <path d="M78 86 Q58 78, 46 90" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <path d="M178 86 Q198 78, 210 90" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <!-- 水雾水滴 -->
    <circle cx="48" cy="72" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="42" cy="82" r="2" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <circle cx="208" cy="72" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="214" cy="82" r="2" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 底部绿化草地弧线 -->
    <path d="M56 156 Q80 138, 104 150 Q128 162, 152 150 Q176 138, 200 156" 
          fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <path d="M72 162 Q90 150, 108 158 Q128 166, 148 158 Q166 150, 184 162" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>
    <!-- 小草装饰 -->
    <path d="M82 154 Q84 142, 88 146" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <path d="M168 154 Q166 142, 162 146" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <path d="M112 158 Q114 148, 118 152" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <path d="M144 158 Q142 148, 138 152" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" opacity="0.9">绿化喷淋</text>

</svg>