<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 噪音 - 声波图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左侧声波 -->
    <rect x="74" y="95" width="8" height="66" rx="4" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    <rect x="90" y="82" width="8" height="92" rx="4" fill="#FFFFFF" stroke="none" opacity="0.85"/>
    <rect x="106" y="70" width="8" height="116" rx="4" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <rect x="122" y="78" width="8" height="100" rx="4" fill="#FFFFFF" stroke="none" opacity="0.85"/>
    <rect x="138" y="90" width="8" height="76" rx="4" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <rect x="154" y="100" width="8" height="56" rx="4" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <rect x="170" y="110" width="8" height="36" rx="4" fill="#FFFFFF" stroke="none" opacity="0.6"/>
  </g>
  <!-- 噪音文字 -->
  <text x="128" y="182" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">噪音</text>

</svg>