<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 雨水收集罐主体 -->
    <rect x="86" y="64" width="84" height="108" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 罐顶圆弧盖 -->
    <path d="M86 74 Q128 48, 170 74" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 罐内水位（中高水位） -->
    <rect x="90" y="96" width="76" height="72" rx="6" fill="#FFFFFF" stroke="none" opacity="0.18"/>
    <!-- 水面线 -->
    <line x1="90" y1="96" x2="166" y2="96" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <!-- 水面波纹 -->
    <path d="M96 102 Q110 96, 124 102 T152 102" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- 右侧水位刻度 -->
    <line x1="154" y1="80" x2="166" y2="80" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="154" y1="96" x2="166" y2="96" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="154" y1="112" x2="166" y2="112" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="154" y1="128" x2="166" y2="128" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="154" y1="144" x2="166" y2="144" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <!-- 左侧雨水滴落 -->
    <path d="M82 58 Q82 58, 78 68 Q76 72, 80 74 Q84 74, 86 68 Q82 58, 82 58Z" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <path d="M94 52 Q94 52, 91 60 Q89 64, 93 66 Q97 66, 99 60 Q94 52, 94 52Z" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <path d="M106 56 Q106 56, 103 64 Q101 68, 105 70 Q109 70, 111 64 Q106 56, 106 56Z" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 顶部云朵（暗示雨水来源） -->
    <ellipse cx="128" cy="54" rx="18" ry="10" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <circle cx="116" cy="50" r="8" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <circle cx="138" cy="48" r="9" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <!-- 罐底支撑脚 -->
    <rect x="96" y="170" width="10" height="8" rx="2" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <rect x="150" y="170" width="10" height="8" rx="2" fill="#FFFFFF" stroke="none" opacity="0.6"/>
  </g>
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" opacity="0.9">雨水位</text>

</svg>