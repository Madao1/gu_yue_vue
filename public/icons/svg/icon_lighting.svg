    <rect x="114" y="132" width="28" height="8" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <rect x="116" y="140" width="24" height="6" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
    <rect x="118" y="146" width="20" height="5" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- 灯丝（隐约可见） -->
    <path d="M118 106 Q124 96, 128 106 Q132 96, 138 106" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.4"/>
    <!-- 光芒射线 -->
    <line x1="128" y1="34" x2="128" y2="44" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <line x1="78" y1="62" x2="86" y2="70" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <line x1="178" y1="62" x2="170" y2="70" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <line x1="62" y1="96" x2="74" y2="100" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <line x1="194" y1="96" x2="182" y2="100" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <line x1="72" y1="132" x2="84" y2="128" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <line x1="184" y1="132" x2="172" y2="128" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <!-- 光芒小点 -->
    <circle cx="128" cy="30" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <circle cx="74" cy="58" r="2" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="182" cy="58" r="2" fill="#FFFFFF" stroke="none" opacity="0.6"/>
