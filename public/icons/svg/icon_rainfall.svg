<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 云朵主体 -->
    <ellipse cx="128" cy="88" rx="36" ry="22" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <circle cx="108" cy="82" r="18" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <circle cx="140" cy="78" r="20" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <circle cx="124" cy="72" r="16" fill="#FFFFFF" stroke="none" opacity="0.95"/>

    <!-- 雨滴 - 第一排 -->
    <line x1="102" y1="118" x2="96" y2="134" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    <line x1="118" y1="118" x2="112" y2="138" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    <line x1="134" y1="118" x2="128" y2="134" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    <line x1="150" y1="118" x2="144" y2="138" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>

    <!-- 雨滴 - 第二排（交错） -->
    <line x1="110" y1="132" x2="105" y2="148" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <line x1="126" y1="132" x2="121" y2="152" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <line x1="142" y1="132" x2="137" y2="148" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <line x1="158" y1="132" x2="153" y2="152" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

    <!-- 水滴状雨滴装饰 -->
    <path d="M100 150 Q100 150, 96 160 Q94 164, 98 166 Q102 166, 104 160 Q100 150, 100 150Z" 
          fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <path d="M132 154 Q132 154, 128 164 Q126 168, 130 170 Q134 170, 136 164 Q132 154, 132 154Z" 
          fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <path d="M152 150 Q152 150, 148 160 Q146 164, 150 166 Q154 166, 156 160 Q152 150, 152 150Z" 
          fill="#FFFFFF" stroke="none" opacity="0.6"/>
  </g>
  <text x="128" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">雨量</text>

</svg>