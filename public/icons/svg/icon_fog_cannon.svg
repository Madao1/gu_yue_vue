<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 雾炮底座 -->
    <rect x="114" y="152" width="28" height="16" rx="4" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <rect x="108" y="164" width="40" height="10" rx="3" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <!-- 雾炮炮筒（倾斜） -->
    <g transform="rotate(-25, 128, 120)">
      <rect x="100" y="70" width="56" height="28" rx="14" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="148" y="74" width="16" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
      <!-- 炮口 -->
      <ellipse cx="168" cy="84" rx="6" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <!-- 中心转轴 -->
    <circle cx="128" cy="132" r="8" fill="#FFFFFF" stroke="none"/>
    <!-- 喷雾效果 -->
    <g opacity="0.7">
      <ellipse cx="168" cy="68" rx="10" ry="5" fill="#FFFFFF" stroke="none" opacity="0.5"/>
      <ellipse cx="178" cy="60" rx="14" ry="7" fill="#FFFFFF" stroke="none" opacity="0.4"/>
      <ellipse cx="190" cy="52" rx="18" ry="9" fill="#FFFFFF" stroke="none" opacity="0.3"/>
    </g>
    <!-- 雾点 -->
    <circle cx="172" cy="58" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="186" cy="48" r="2" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <circle cx="182" cy="62" r="2" fill="#FFFFFF" stroke="none" opacity="0.4"/>
  </g>
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">雾炮</text>

</svg>