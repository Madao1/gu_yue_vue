<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 风力 - 风力发电机图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 发电机塔筒 -->
    <line x1="128" y1="88" x2="128" y2="176" stroke="#FFFFFF" stroke-width="5"/>
    <!-- 底座 -->
    <ellipse cx="128" cy="178" rx="22" ry="5" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 叶片1 -->
    <line x1="128" y1="88" x2="128" y2="44" stroke="#FFFFFF" stroke-width="6"/>
    <!-- 叶片2 -->
    <line x1="128" y1="88" x2="170" y2="112" stroke="#FFFFFF" stroke-width="6"/>
    <!-- 叶片3 -->
    <line x1="128" y1="88" x2="86" y2="112" stroke="#FFFFFF" stroke-width="6"/>
    <!-- 中心轮毂 -->
    <circle cx="128" cy="88" r="10" fill="#FFFFFF" stroke="none"/>
    <!-- 叶片端部小圆 -->
    <circle cx="128" cy="42" r="4" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <circle cx="172" cy="114" r="4" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <circle cx="84" cy="114" r="4" fill="#FFFFFF" stroke="none" opacity="0.8"/>
  </g>
  <!-- 风力文字 -->
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">风力</text>

</svg>