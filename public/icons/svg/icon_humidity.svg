<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 湿度 - 水滴图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主水滴 -->
    <path d="M128 52 Q128 52, 100 100 Q82 130, 100 156 Q112 174, 128 174 Q144 174, 156 156 Q174 130, 156 100 Q128 52, 128 52Z" 
          fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <!-- 水滴高光 -->
    <ellipse cx="118" cy="118" rx="8" ry="14" fill="#93C5FD" stroke="none" opacity="0.6"/>
    <!-- 小水滴装饰 -->
    <path d="M158 68 Q158 68, 150 82 Q144 92, 150 100 Q154 106, 158 106 Q162 106, 166 100 Q172 92, 166 82 Q158 68, 158 68Z" 
          fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <path d="M68 108 Q68 108, 62 120 Q58 128, 62 134 Q65 138, 68 138 Q71 138, 74 134 Q78 128, 74 120 Q68 108, 68 108Z" 
          fill="#FFFFFF" stroke="none" opacity="0.4"/>
  </g>
  <!-- 湿度文字 -->
  <text x="128" y="202" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">湿度</text>

</svg>