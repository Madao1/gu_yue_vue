<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 洗车槽外框 -->
    <rect x="64" y="80" width="128" height="72" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 槽内底部 -->
    <rect x="72" y="130" width="112" height="16" rx="3" fill="#FFFFFF" stroke="none" opacity="0.25"/>
    <!-- 槽内水面/底面 -->
    <line x1="72" y1="136" x2="184" y2="136" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <!-- 左侧喷水口 -->
    <rect x="58" y="96" width="8" height="6" rx="2" fill="#FFFFFF" stroke="none"/>
    <line x1="54" y1="99" x2="44" y2="99" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="50" y1="94" x2="40" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="104" x2="40" y2="108" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- 右侧喷水口 -->
    <rect x="190" y="96" width="8" height="6" rx="2" fill="#FFFFFF" stroke="none"/>
    <line x1="202" y1="99" x2="212" y2="99" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="206" y1="94" x2="216" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="206" y1="104" x2="216" y2="108" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- 中间水波纹 -->
    <path d="M88 122 Q100 116, 112 122 T136 122 T160 122" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
    <path d="M96 114 Q108 108, 120 114 T144 114" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <!-- 车轮示意 -->
    <circle cx="96" cy="152" r="10" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <circle cx="160" cy="152" r="10" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <!-- 车身底部 -->
    <line x1="96" y1="142" x2="160" y2="142" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
  </g>
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">洗车槽</text>

</svg>