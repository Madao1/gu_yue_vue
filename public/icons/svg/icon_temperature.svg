<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 温度 - 温度计图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 温度计外管 -->
    <rect x="118" y="58" width="20" height="108" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 温度计底部球泡 -->
    <circle cx="128" cy="162" r="16" fill="#FFFFFF" stroke="none"/>
    <!-- 温度计内部液柱 -->
    <rect x="123" y="88" width="10" height="70" rx="5" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    <!-- 刻度线 -->
    <line x1="142" y1="78" x2="152" y2="78" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="142" y1="98" x2="152" y2="98" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="142" y1="118" x2="152" y2="118" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="142" y1="138" x2="152" y2="138" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  </g>
  <!-- 温度文字 -->
  <text x="128" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">温度</text>

</svg>