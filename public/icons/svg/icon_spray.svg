    <path d="M110 94 Q104 114, 94 128" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <path d="M128 96 Q128 118, 128 134" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <path d="M146 94 Q152 114, 162 128" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <path d="M158 92 Q166 108, 178 118" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <!-- 水滴 -->
    <circle cx="76" cy="124" r="3" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <circle cx="92" cy="136" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="128" cy="142" r="3" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <circle cx="164" cy="136" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.6"/>
    <circle cx="180" cy="124" r="3" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <!-- 小水滴 -->
    <circle cx="104" cy="126" r="2" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <circle cx="152" cy="126" r="2" fill="#FFFFFF" stroke="none" opacity="0.5"/>
