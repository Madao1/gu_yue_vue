<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 水箱/水位容器外框 -->
    <rect x="82" y="52" width="92" height="128" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 容器底部加固 -->
    <rect x="78" y="172" width="100" height="10" rx="4" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 水位线 - 2档（中高水位） -->
    <rect x="86" y="88" width="84" height="84" rx="4" fill="#FFFFFF" stroke="none" opacity="0.2"/>
    <!-- 水面 -->
    <line x1="86" y1="88" x2="170" y2="88" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <!-- 水面波纹 -->
    <path d="M90 94 Q106 88, 122 94 T154 94" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- 刻度线 -->
    <line x1="150" y1="68" x2="166" y2="68" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="150" y1="88" x2="166" y2="88" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="150" y1="108" x2="166" y2="108" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="150" y1="128" x2="166" y2="128" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <line x1="150" y1="148" x2="166" y2="148" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <!-- 水位指示箭头 -->
    <line x1="128" y1="72" x2="128" y2="84" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <polygon points="128,68 122,78 134,78" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    <!-- 水滴装饰 -->
    <path d="M106 72 Q106 72, 102 80 Q100 84, 104 86 Q108 86, 110 80 Q106 72, 106 72Z" fill="#FFFFFF" stroke="none" opacity="0.5"/>
  </g>
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">水位</text>

</svg>