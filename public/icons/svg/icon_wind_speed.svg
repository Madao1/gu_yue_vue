<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 风速 - 风速旗帜图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 旗杆 -->
    <line x1="78" y1="56" x2="78" y2="180" stroke="#FFFFFF" stroke-width="5"/>
    <!-- 底座 -->
    <ellipse cx="78" cy="182" rx="14" ry="4" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 旗帜1 - 大风 -->
    <path d="M80 62 Q120 58, 140 66 Q130 78, 140 88 Q120 82, 80 86Z" fill="#FFFFFF" stroke="none" opacity="0.95"/>
    <!-- 旗帜2 - 中风 -->
    <path d="M80 94 Q110 90, 128 98 Q118 108, 128 118 Q110 112, 80 116Z" fill="#FFFFFF" stroke="none" opacity="0.75"/>
    <!-- 旗帜3 - 小风 -->
    <path d="M80 126 Q100 122, 116 130 Q108 138, 116 146 Q100 140, 80 144Z" fill="#FFFFFF" stroke="none" opacity="0.55"/>
    <!-- 风线 -->
    <path d="M148 100 Q168 92, 188 100" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
    <path d="M152 130 Q166 124, 180 130" stroke="#FFFFFF" stroke-width="2.5" opacity="0.3"/>
  </g>
  <!-- 风速文字 -->
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">风速</text>

</svg>