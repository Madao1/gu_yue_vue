<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 主圆形 -->
  <circle cx="128" cy="128" r="88" fill="url(#circleGrad)"/>

  <!-- 图标内容 -->
  
  <!-- 风向 - 风向标图标 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 立杆 -->
    <line x1="128" y1="68" x2="128" y2="170" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 底座 -->
    <ellipse cx="128" cy="172" rx="16" ry="5" fill="#FFFFFF" stroke="none" opacity="0.5"/>
    <!-- 水平旋转杆 -->
    <line x1="68" y1="96" x2="188" y2="96" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 左侧箭头（指向）-->
    <polygon points="68,96 88,82 88,110" fill="#FFFFFF" stroke="none"/>
    <!-- 右侧尾翼 -->
    <rect x="152" y="84" width="36" height="24" rx="3" fill="#FFFFFF" stroke="none" opacity="0.8"/>
    <!-- 中心圆点 -->
    <circle cx="128" cy="96" r="8" fill="#FFFFFF" stroke="none"/>
    <!-- 方向标记 -->
    <text x="128" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">N</text>
  </g>
  <!-- 风向文字 -->
  <text x="128" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" opacity="0.9">风向</text>

</svg>